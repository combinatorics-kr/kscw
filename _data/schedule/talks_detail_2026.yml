- id: ct-jeongwanbyon
  date: Jul 31 (Fri)
  time: 09:30–10:10
  type: contributed-talk
  title: Bounds of the Antibandwidth on Various Triangular Grid Graph Structures
  speaker: Jeongwan Byon
  affiliation: Hanyang University
  abstract: 
    The antibandwidth problem is to find a labeling of graph vertices that maximizes the minimum label difference between adjacent vertices. This problem is known to be NP-complete. In this talk, we explore the antibandwidth of triangular grid graphs, focusing on two distinct structural variations; the regular triangular shape ($T_n$) and the regular hexagon shape ($H_n$). First, we review the established upper and lower bounds for $T_n$, where the gap between the bounds is shown to be $\lfloor n/6 \rfloor$, implying that the exact values are determined when $n \le 5$. Building upon these foundational concepts, we introduce new upper and lower bounds for the hexagon-shaped triangular grid graph $H_n$, proving that the gap between them is $\lfloor n/3 \rfloor$. By comparing the labeling strategies and structural properties of these two variations, this presentation is expected to contribute to a deeper understanding of labeling problems in triangular grid graphs with complex structures.

  counter: 6

- id: ct-seongbinpark
  date: Jul 31 (Fri)
  time: 10:20–11:00
  type: contributed-talk
  title: Exact Subquadratic Algorithm for Many-to-Many Matching on Planar Point Sets with Integer Coordinates
  speaker: Seongbin Park
  affiliation: POSTECH
  abstract: 
    We study the many-to-many matching problem on planar point sets with integer coordinates;
    Given two disjoint sets $R,B \subset [\Delta]^2$ with $|R|+|B|=n$, the goal is to select a set of edges between $R$ and $B$ so that every point is incident to at least one edge and the total Euclidean length is minimized.
    In the general case that $R$ and $B$ are point sets in the plane, the best-known algorithm for the many-to-many matching problem takes $\tilde{O}(n^2)$ time. 
    We present an exact $\tilde{O}(n^{1.5} \log \Delta)$ time algorithm for point sets in $[\Delta]^2$. 
    To the best of our knowledge, this is the first subquadratic exact algorithm for planar many-to-many matching under bounded integer coordinates.

  counter: 7
