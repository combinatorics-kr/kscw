- id: ct-hyungukim
  date: Jul 28 (Tue)
  time: 09:30–10:10
  type: contributed-talk
  title: Extension theorems for arrangements of pseudolines and pseudocircles
  speaker: Hyungu Kim
  affiliation: KAIST / IBS DIMAG
  abstract: 
    A pseudoline is a curve in the plane that need not be straight but behaves like a line in one essential way; any two pseudolines cross exactly once. A finite collection of them forms a pseudoline arrangement, a combinatorial relaxation of straight line arrangements. Peudocircles are pretty much the same, but they imitate circles instead of lines. In this talk I will introduce their non-realizability results and extension theorems to show how these curves both defy and imitate their straight and round counterparts.

    Levi's extension lemma guarantees that through any two points one can always add a new pseudoline compatible with the arrangement. Snoeyink and Hershberger showed the pseudocircle counterpart of the lemma. Goodman, Pollack, Wenger, and Zamfirescu proved that every pseudoline arrangement extends to a topological plane, a geometry whose "lines" may be curved, but in which any two points still lie on exactly one. I will sketch these results and close with work in progress carrying this topological plane extension over to arrangements that also contain pseudocircles. This is a joint work with Andreas Holmsen.

  counter: 1

- id: it-shinwooan
  date: Jul 28 (Tue)
  time: 14:00–14:50
  type: invited-talk
  title: 'VC Dimension Theory and Distance-Related Problems'
  speaker: Shinwoo An
  affiliation: Bar-Ilan University
  homepage: https://www.shinwooan.com/
  abstract: 
    Vapnik–Chervonenkis dimension (VC dimension) is usually viewed as a measure of complexity for set systems, with many applications in extremal combinatorics, discrete geometry, and learning theory.
    In this talk, I will explain how the same language can be used to study distances in graphs. Given a graph, natural set systems arise from metric balls and distance ranges; bounding their VC dimension gives an efficient way to capture how complicated the graph metric is.

    I will discuss on how this perspective connects to distance-related problems such as computing the graph diameter and constructing distance oracles in minor-free graphs.
    In particular, I will focus on a recent result of Le and Wulff-Nilsen on VC set systems in minor-free graphs and digraphs. Their work shows that carefully chosen set systems arising from distances can have bounded VC dimension even for directed graphs, and uses this structure to obtain applications to diameter and distance oracles. 
    Lastly, I will briefly mention my own result on approximating the diameter of planar digraphs, as a further example of how the idea of capturing graph metric can inform efficient distance-related algorithms.

  counter: 2

- id: ct-seojinyoon
  date: Jul 29 (Wed)
  time: 09:30–10:10
  type: contributed-talk
  title: Subquadratic-Time Algorithm for Diameter in Disk Graphs
  speaker: Seojin Yoon
  affiliation: POSTECH
  abstract: 
    The diameter of a graph is the maximum shortest-path distance between any pair of vertices and is one of the most fundamental graph parameters. While computing the diameter of general graphs is known to require essentially quadratic time under widely believed complexity assumptions, faster algorithms are possible for restricted graph classes.
    In this talk, I present the first truly subquadratic-time algorithm for computing the diameter of disk graphs. Given a set of n disks in the plane, we compute the diameter of their intersection graph in Õ(n^{2−1/20}) time, resolving a recent open problem. The algorithm also improves the best-known running time for unit disk graphs to Õ(n^{2−1/16}) and extends to intersection graphs of balls under any Lp metric with 1 < p < ∞.
    The main idea is to revisit a recent framework for geometric diameter computation and replace one of its key geometric reductions with a simpler approach based on farthest-color Voronoi diagrams, leading to improved algorithms for both disk graphs and unit disk graphs.

  counter: 3

